services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loopiq-open-meteo-pipeline
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    command: ["python", "-m", "src.cli", "run-all"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loopiq-open-meteo-dashboard
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      pipeline:
        condition: service_completed_successfully
    command:
      [
        "streamlit",
        "run",
        "src/dashboard/app.py",
        "--server.port=8501",
        "--server.address=0.0.0.0",
        "--server.headless=true"
      ]
