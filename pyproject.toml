[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopiq-open-meteo-lakehouse"
version = "1.0.0"
description = "End-to-end Medallion Lakehouse Pipeline for Open-Meteo Weather & Aged Care Risk Analytics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "urllib3>=2.2.0",
    "duckdb>=1.1.0",
    "deltalake>=0.17.4",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
